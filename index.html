<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal · Finisi</title>
<style>
:root { --bg:#FBF9F6; --card:#FFFFFF; --ink:#1B1C1A; --muted:#4C4640; --line:#CEC5BD; --accent:#994530; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif; -webkit-text-size-adjust:100%; }
main { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
.brand { font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:20px; }
h1 { font:700 30px/1.2 Georgia,"Times New Roman",serif; margin:0 0 8px; letter-spacing:-.01em; }
h2 { font:700 20px/1.3 Georgia,"Times New Roman",serif; margin:36px 0 10px; padding-top:20px; border-top:1px solid var(--line); }
h3 { font-size:16px; margin:22px 0 6px; }
p, li { color:var(--muted); }
strong { color:var(--ink); }
a { color:var(--accent); }
code { font:13px ui-monospace,SFMono-Regular,Menlo,monospace; background:#F0EDE8; padding:1px 5px; border-radius:4px; }
table { width:100%; border-collapse:collapse; margin:14px 0; font-size:14px; background:var(--card); }
th, td { text-align:left; vertical-align:top; padding:10px; border:1px solid var(--line); }
th { color:var(--ink); background:#F5F2ED; }
td { color:var(--muted); }
nav.links { margin-top:48px; padding-top:20px; border-top:1px solid var(--line); font-size:14px; display:flex; gap:20px; }
</style>
</head>
<body>
<main>
<div class="brand">Finisi</div>
<h1>Finisi</h1><p>Legal documents for the Finisi app.</p><ul><li><a href="finisi/terms/">Terms of Use</a></li><li><a href="finisi/privacy/">Privacy Policy</a></li></ul>
<nav class="links"><a href="finisi/terms/">Terms of Use</a><a href="finisi/privacy/">Privacy Policy</a></nav>
</main>
</body>
</html>
